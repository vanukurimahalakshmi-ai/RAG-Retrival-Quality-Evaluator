<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — RAG Retrieval Quality Evaluator</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
  
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.12), transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.08), transparent 40%),
                  var(--bg-dark);
      padding: 2.5rem 1rem;
      position: relative;
      overflow: hidden;
    }

    .auth-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(139, 92, 246, 0.1);
      width: 100%;
      max-width: 480px;
      padding: 2.5rem 2.25rem;
      position: relative;
      z-index: 2;
    }

    .auth-brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #fff;
      margin: 0 auto 1.25rem;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35);
    }

    .auth-title {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .form-group-custom {
      margin-bottom: 1.15rem;
    }

    .form-label-custom {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
      display: block;
    }

    .form-label-custom .req-star {
      color: var(--status-failure);
      margin-left: 2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      font-size: 1rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input-auth {
      width: 100%;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.75rem 2.6rem 0.75rem 2.6rem;
      color: var(--text-primary);
      font-size: 0.9rem;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-input-auth:focus {
      outline: none;
      border-color: var(--accent-purple);
      background-color: #162032;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
    }

    .form-input-auth:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--accent-purple);
    }

    .btn-toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      font-size: 1rem;
      transition: color 0.2s;
    }

    .btn-toggle-password:hover {
      color: var(--text-primary);
    }

    .password-strength-meter {
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      margin-top: 0.45rem;
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      width: 0%;
      transition: all 0.3s ease;
    }

    .password-hint {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .auth-btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1.5rem;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
      margin-top: 1.5rem;
    }

    .auth-btn-submit:hover {
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45);
      transform: translateY(-1px);
    }

    .auth-btn-submit:active {
      transform: translateY(0);
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .auth-footer a {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .auth-footer a:hover {
      color: #38bdf8;
      text-decoration: underline;
    }

    .ambient-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      pointer-events: none;
    }
    .glow-1 { top: -150px; right: -100px; background: var(--accent-purple); }
    .glow-2 { bottom: -150px; left: -100px; background: var(--accent-cyan); }
  </style>
</head>
<body>

<div class="auth-page-wrapper">
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="auth-card">
    <div class="auth-brand-icon">
      <i class="bi bi-person-plus"></i>
    </div>
    <h1 class="auth-title">Create an Account</h1>
    <p class="auth-subtitle">Join the RAG Retrieval Quality Evaluator</p>

    <!-- Error Alert -->
    {% if error %}
      <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3 small" role="alert" style="border-radius: 8px;">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <div>{{ error }}</div>
      </div>
    {% endif %}

    <!-- Registration Form -->
    <form method="POST" action="{% url 'register' %}" id="registerForm">
      {% csrf_token %}

      <div class="row g-2 mb-1">
        <div class="col-sm-6">
          <div class="form-group-custom">
            <label class="form-label-custom" for="username">Username<span class="req-star">*</span></label>
            <div class="input-wrapper">
              <i class="bi bi-person input-icon"></i>
              <input type="text" 
                     id="username" 
                     name="username" 
                     class="form-input-auth" 
                     placeholder="e.g. alex_ml" 
                     value="{{ form_data.username|default:'' }}"
                     minlength="3"
                     maxlength="150"
                     required 
                     autofocus>
            </div>
          </div>
        </div>

        <div class="col-sm-6">
          <div class="form-group-custom">
            <label class="form-label-custom" for="first_name">Full Name</label>
            <div class="input-wrapper">
              <i class="bi bi-card-text input-icon"></i>
              <input type="text" 
                     id="first_name" 
                     name="first_name" 
                     class="form-input-auth" 
                     placeholder="Alex Rivers" 
                     value="{{ form_data.first_name|default:'' }}">
            </div>
          </div>
        </div>
      </div>

      <div class="form-group-custom">
        <label class="form-label-custom" for="email">Email Address<span class="req-star">*</span></label>
        <div class="input-wrapper">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" 
                 id="email" 
                 name="email" 
                 class="form-input-auth" 
                 placeholder="name@company.com" 
                 value="{{ form_data.email|default:'' }}"
                 required>
        </div>
      </div>

      <div class="form-group-custom">
        <label class="form-label-custom" for="password">Password<span class="req-star">*</span></label>
        <div class="input-wrapper">
          <i class="bi bi-shield-lock input-icon"></i>
          <input type="password" 
                 id="password" 
                 name="password" 
                 class="form-input-auth" 
                 placeholder="At least 6 characters" 
                 minlength="6"
                 required>
          <button type="button" class="btn-toggle-password" id="togglePasswordBtn">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
        </div>
        <div class="password-strength-meter">
          <div class="password-strength-bar" id="strengthBar"></div>
        </div>
        <div class="password-hint" id="passwordHint">
          <i class="bi bi-info-circle"></i> Use at least 6 characters with mixed letters and numbers
        </div>
      </div>

      <div class="form-group-custom">
        <label class="form-label-custom" for="confirm_password">Confirm Password<span class="req-star">*</span></label>
        <div class="input-wrapper">
          <i class="bi bi-check2-circle input-icon"></i>
          <input type="password" 
                 id="confirm_password" 
                 name="confirm_password" 
                 class="form-input-auth" 
                 placeholder="Re-enter password" 
                 minlength="6"
                 required>
        </div>
        <div id="matchFeedback" class="small mt-1 d-none"></div>
      </div>

      <button type="submit" class="auth-btn-submit" id="btnRegisterSubmit">
        <i class="bi bi-rocket-takeoff"></i> Create Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{% url 'login' %}">Sign in</a>
      <div class="mt-2">
        <a href="/" class="text-secondary small" style="text-decoration:none;">
          <i class="bi bi-arrow-left me-1"></i> Return to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Toggle password visibility
  const toggleBtn = document.getElementById('togglePasswordBtn');
  const passwordInput = document.getElementById('password');
  const toggleIcon = document.getElementById('togglePasswordIcon');

  if (toggleBtn && passwordInput && toggleIcon) {
    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      toggleIcon.classList.toggle('bi-eye', !isPassword);
      toggleIcon.classList.toggle('bi-eye-slash', isPassword);
    });
  }

  // Password Strength and Match Checker
  const pwd = document.getElementById('password');
  const confirmPwd = document.getElementById('confirm_password');
  const strengthBar = document.getElementById('strengthBar');
  const hint = document.getElementById('passwordHint');
  const matchFeedback = document.getElementById('matchFeedback');

  pwd.addEventListener('input', () => {
    const val = pwd.value;
    let score = 0;
    if (val.length >= 6) score += 25;
    if (val.length >= 10) score += 25;
    if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 25;
    if (/[0-9]/.test(val) || /[^A-Za-z0-9]/.test(val)) score += 25;

    strengthBar.style.width = `${score}%`;
    if (score <= 25) {
      strengthBar.style.backgroundColor = '#ef4444';
      hint.textContent = 'Weak password';
      hint.style.color = '#ef4444';
    } else if (score <= 75) {
      strengthBar.style.backgroundColor = '#f59e0b';
      hint.textContent = 'Medium strength password';
      hint.style.color = '#f59e0b';
    } else {
      strengthBar.style.backgroundColor = '#10b981';
      hint.textContent = 'Strong password';
      hint.style.color = '#10b981';
    }
    checkMatch();
  });

  confirmPwd.addEventListener('input', checkMatch);

  function checkMatch() {
    if (!confirmPwd.value) {
      matchFeedback.classList.add('d-none');
      return;
    }
    matchFeedback.classList.remove('d-none');
    if (pwd.value === confirmPwd.value) {
      matchFeedback.textContent = '✓ Passwords match';
      matchFeedback.style.color = '#10b981';
    } else {
      matchFeedback.textContent = '✗ Passwords do not match';
      matchFeedback.style.color = '#ef4444';
    }
  }
</script>

</body>
</html>
